[EPD]
mode=color
# Must stay as the driver's exact primaries: epd7in3f.getbuffer() re-quantises to these.
palette_filter = [0,0,0],[255,255,255],[0,255,0],[0,0,255],[255,0,0],[255,255,0],[255,128,0]

[Display]
# No `dither` option on purpose: the Waveshare driver then maps colours with Pillow's
# Floyd-Steinberg (sRGB), which is the look calibrated since June 2026.
# omni-epd silently ignores unknown names (e.g. "Bayer4x4"); Bayer 4x4 is `dither=Bayer`
# with `dither_args=4,4`. `dither=none` disables dithering entirely (a different look).
