name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest supported version; 3.13 is what the Pi runs.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # lgpio only drives the real GPIO pins. It has no wheel for newer Pythons and
        # needs system libraries to build, and nothing in the test suite imports it.
        run: uv sync --locked --no-install-package lgpio

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest -q
        env:
          OPENAI_API_KEY: test
